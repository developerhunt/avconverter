<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Cloud Render | High Speed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; font-family: sans-serif; }
        .glass {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 24px; height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="glass w-full max-w-lg rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                Turbo Render
            </h1>
            <p class="text-slate-400 text-sm">Server-Side FFmpeg Engine</p>
        </div>

        <div class="space-y-4">
            
            <div onclick="document.getElementById('imgIn').click()" 
                 class="border border-dashed border-slate-600 rounded-xl p-4 flex items-center gap-4 cursor-pointer hover:bg-slate-800 transition">
                <div class="bg-indigo-500/20 p-2 rounded-lg text-indigo-400">🖼️</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-slate-200">Upload Image</p>
                    <p id="imgName" class="text-xs text-slate-500 truncate">No file chosen</p>
                </div>
                <input type="file" id="imgIn" accept="image/*" hidden onchange="setFile(this, 'imgName')">
            </div>

            <div onclick="document.getElementById('audIn').click()" 
                 class="border border-dashed border-slate-600 rounded-xl p-4 flex items-center gap-4 cursor-pointer hover:bg-slate-800 transition">
                <div class="bg-purple-500/20 p-2 rounded-lg text-purple-400">🎵</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-slate-200">Upload Audio</p>
                    <p id="audName" class="text-xs text-slate-500 truncate">No file chosen</p>
                </div>
                <input type="file" id="audIn" accept="audio/*" hidden onchange="setFile(this, 'audName')">
            </div>

            <button id="btn" onclick="processVideo()" disabled
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 py-4 rounded-xl font-bold shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition active:scale-95 flex justify-center items-center gap-2">
                <span>Start Cloud Render</span>
            </button>
        </div>

        <div id="resultArea" class="hidden mt-6 pt-6 border-t border-slate-700 text-center">
            <div id="loading" class="flex flex-col items-center gap-3">
                <div class="loader"></div>
                <p class="text-sm text-indigo-300 animate-pulse">Processing on Server...</p>
            </div>
            
            <a id="downloadLink" href="#" class="hidden block bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-lg font-medium transition">
                ⬇️ Download Video
            </a>
            
            <p id="errorMsg" class="hidden text-red-400 text-sm mt-2"></p>
        </div>

    </div>

    <script>
        // ==========================================
        // ✅ CONFIGURATION: CONNECTED TO YOUR BACKEND
        // ==========================================
        const BACKEND_URL = "https://avconverter.onrender.com"; 
        
        let imgFile = null;
        let audFile = null;

        function setFile(input, labelId) {
            const file = input.files[0];
            if(file) {
                document.getElementById(labelId).innerText = file.name;
                document.getElementById(labelId).classList.add("text-white");
                if(input.id === 'imgIn') imgFile = file;
                if(input.id === 'audIn') audFile = file;
                checkReady();
            }
        }

        function checkReady() {
            if(imgFile && audFile) {
                document.getElementById('btn').disabled = false;
            }
        }

        async function processVideo() {
            const btn = document.getElementById('btn');
            const resultArea = document.getElementById('resultArea');
            const loading = document.getElementById('loading');
            const downloadLink = document.getElementById('downloadLink');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            resultArea.classList.remove('hidden');
            loading.classList.remove('hidden');
            downloadLink.classList.add('hidden');
            errorMsg.classList.add('hidden');

            const formData = new FormData();
            formData.append("image", imgFile);
            formData.append("audio", audFile);

            try {
                // Send to Server
                const response = await fetch(`${BACKEND_URL}/render`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Server failed to render. (Check Render Logs)");

                // Get Blob
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);

                // Show Download
                loading.classList.add('hidden');
                downloadLink.href = url;
                downloadLink.download = `Cloud_Video_${Date.now()}.mp4`;
                downloadLink.classList.remove('hidden');
                
                // Auto Click
                downloadLink.click();
                
                btn.innerText = "Render Another";
                btn.disabled = false;

            } catch (err) {
                loading.classList.add('hidden');
                errorMsg.innerText = "Error: " + err.message;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
